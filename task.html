<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Landing</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Enjoy your dream vacation</h2>
      <p class="intro">
        Plan and book our perfect trip with expert advice, travel tips,
        destination information and inspiration from us
      </p>

      <div class="cards">
        <div class="card">
          <div class="photo">
            <img src="./imgs/Australia.jpg" alt="Australia" />
          </div>
          <h3>Australia</h3>
          <p>2246 properties</p>
        </div>

        <div class="card">
          <div class="photo">
            <img src="./imgs/Japan.jpg" alt="Japan" />
          </div>
          <h3>Japan</h3>
          <p>1278 properties</p>
        </div>

        <div class="card">
          <div class="photo">
            <img src="./imgs/New Zealand.jpg" alt="New Zealand" />
          </div>
          <h3>New Zealand</h3>
          <p>480 properties</p>
        </div>

        <div class="card">
          <div class="photo">
            <img src="./imgs/Greece.jpg" alt="Greece" />
          </div>
          <h3>Greece</h3>
          <p>320 properties</p>
        </div>
      </div>
    </div>
  </body>
</html>
